<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FD3FF"/><stop offset="1" stop-color="#2E9BF0"/>
    </linearGradient>
    <linearGradient id="bgR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F6FE0"/><stop offset="1" stop-color="#1B3FA8"/>
    </linearGradient>
    <linearGradient id="paneL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E6F2FF"/>
    </linearGradient>
    <linearGradient id="paneR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F8FF"/><stop offset="1" stop-color="#D5E3FA"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB13B"/><stop offset="1" stop-color="#FF7A1A"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0A1F5C" flood-opacity="0.35"/>
    </filter>
    <filter id="outer" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Hintergrund: zweigeteilt (hell/dunkel) als Anspielung auf zwei Fenster -->
  <g filter="url(#outer)">
    <g clip-path="url(#squircle)">
      <rect x="100" y="100" width="824" height="824" fill="url(#bgR)"/>
      <path d="M100 100 H540 C500 330 560 560 470 924 H100 Z" fill="url(#bgL)"/>
      <rect x="100" y="100" width="824" height="420" fill="url(#gloss)"/>
    </g>
  </g>

  <g transform="translate(0,48)">
  <!-- Linkes Fenster -->
  <g filter="url(#shadow)">
    <rect x="178" y="300" width="318" height="430" rx="38" fill="url(#paneL)"/>
    <!-- Ordner-Symbol im Kopf -->
    <path d="M214 342 h44 l14 14 h52 a10 10 0 0 1 10 10 v42 a10 10 0 0 1 -10 10 h-110 a10 10 0 0 1 -10 -10 v-56 a10 10 0 0 1 10 -10 z" fill="#3FA9F5"/>
    <rect x="348" y="364" width="112" height="18" rx="9" fill="#B8D4F2"/>
    <rect x="214" y="456" width="246" height="34" rx="12" fill="#2E9BF0"/>
    <rect x="214" y="512" width="210" height="20" rx="10" fill="#C9DDF3"/>
    <rect x="214" y="560" width="230" height="20" rx="10" fill="#C9DDF3"/>
    <rect x="214" y="608" width="180" height="20" rx="10" fill="#C9DDF3"/>
    <rect x="214" y="656" width="200" height="20" rx="10" fill="#C9DDF3"/>
  </g>

  <!-- Rechtes Fenster -->
  <g filter="url(#shadow)">
    <rect x="528" y="300" width="318" height="430" rx="38" fill="url(#paneR)"/>
    <path d="M564 342 h44 l14 14 h52 a10 10 0 0 1 10 10 v42 a10 10 0 0 1 -10 10 h-110 a10 10 0 0 1 -10 -10 v-56 a10 10 0 0 1 10 -10 z" fill="#2F6FE0"/>
    <rect x="698" y="364" width="112" height="18" rx="9" fill="#AFC4EA"/>
    <rect x="564" y="464" width="200" height="20" rx="10" fill="#BFD0EE"/>
    <rect x="564" y="512" width="236" height="20" rx="10" fill="#BFD0EE"/>
    <rect x="564" y="560" width="170" height="20" rx="10" fill="#BFD0EE"/>
    <rect x="564" y="608" width="214" height="20" rx="10" fill="#BFD0EE"/>
    <rect x="564" y="656" width="150" height="20" rx="10" fill="#BFD0EE"/>
  </g>

  <!-- Kopier-Pfeil von links nach rechts -->
  <g filter="url(#shadow)">
    <path d="M330 262 C 400 170, 590 160, 676 236" fill="none" stroke="url(#arrow)" stroke-width="40" stroke-linecap="round"/>
    <path d="M640 182 L 712 262 L 612 282 Z" fill="#FF7A1A" stroke="#FF7A1A" stroke-width="16" stroke-linejoin="round"/>
  </g>
  </g>
</svg>
